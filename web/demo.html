const qrUrl = t => baseLink()+(t==="dom"?"#domicilio":"#mesa"+t);
function drawQRs(){
  if(!window.QRCode) return;
  document.querySelectorAll("[data-qr]").forEach(el=>{ el.innerHTML=""; const dom=el.dataset.qr==="dom"; try{ new QRCode(el,{text:qrUrl(el.dataset.qr),width:220,height:220,colorDark:dom?"#5B2A14":"#5F010F",colorLight:dom?"#F4E9DC":"#FFFFFF",correctLevel:QRCode.CorrectLevel.M}); }catch(e){} });
}
async function downloadSheet(){
  if(!window.QRCode){ toast("No cargó el generador de QR."); return; }
  const N=+S.config.tables||10, cards=[{k:"dom",title:"A DOMICILIO",sub:"Escanea, pide y te lo llevamos",bg:"#F4E9DC",fg:"#5B2A14",band:"#5B2A14",tag:"ANTOJOS COLOMBIANOS"}].concat(Array.from({length:N},(_,i)=>({k:i+1,title:"MESA "+(i+1),sub:"Escanea, pide y te lo llevamos a la mesa",bg:"#FFFFFF",fg:"#5F010F",band:"#5F010F",tag:"C A F E T E R Í A"})));
  const cols=3, cw=760, ch=980, pad=60, rows=Math.ceil(cards.length/cols);
  const c=document.createElement("canvas"); c.width=cols*cw+pad*2; c.height=rows*ch+pad*2;
  const x=c.getContext("2d"); x.fillStyle="#FFFFFF"; x.fillRect(0,0,c.width,c.height);
  try{ await document.fonts.load('60px "Alfa Slab One"'); await document.fonts.load('600 28px "Figtree"'); }catch(e){}
  cards.forEach((cd,i)=>{
    const cx=pad+(i%cols)*cw, cy=pad+Math.floor(i/cols)*ch;
    x.fillStyle=cd.bg; x.fillRect(cx+10,cy+10,cw-20,ch-20);
    x.strokeStyle="#E2D4C6"; x.setLineDash([12,10]); x.strokeRect(cx+10,cy+10,cw-20,ch-20); x.setLineDash([]);
    x.fillStyle=cd.band; x.fillRect(cx+40,cy+40,cw-80,150);
    const bw=cw-80; x.fillStyle="#F2B13F"; x.fillRect(cx+40,cy+190,bw/2,14); x.fillStyle="#124982"; x.fillRect(cx+40+bw/2,cy+190,bw/4,14); x.fillStyle="#C8102E"; x.fillRect(cx+40+bw*3/4,cy+190,bw/4,14);
    x.fillStyle="#FFFFFF"; x.textAlign="center"; x.font='44px "Alfa Slab One", Georgia, serif'; x.fillText("HECHO EN MI PUEBLO",cx+cw/2,cy+125);
    x.font='600 22px "Figtree", sans-serif'; x.fillText(cd.tag,cx+cw/2,cy+165);
    const tmp=document.createElement("div"); new QRCode(tmp,{text:qrUrl(cd.k),width:480,height:480,colorDark:cd.fg,colorLight:cd.bg,correctLevel:QRCode.CorrectLevel.M});
    const qc=tmp.querySelector("canvas"); if(qc) x.drawImage(qc,cx+(cw-480)/2,cy+240,480,480);
    x.fillStyle=cd.fg; x.font='68px "Alfa Slab One", Georgia, serif'; x.fillText(cd.title,cx+cw/2,cy+820);
    x.fillStyle="#2B1A10"; x.font='500 26px "Figtree", sans-serif'; x.fillText(cd.sub,cx+cw/2,cy+872);
  });
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl){
    if(window.claude){ toast("Esta vista no permite descargar archivos."); return; }
    // En un servidor propio: descarga normal del navegador.
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="QR-hecho-en-mi-pueblo.png"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); toast("Hoja de QR descargada"); return;
  }
  try{ const r=await dl.save({filename:"QR-hecho-en-mi-pueblo.png",data:blob}); if(r&&r.status==="saved") toast("Hoja de QR descargada"); }catch(e){ if(e&&e.code!=="declined"&&e.code!=="cancelled") toast("No se pudo descargar la hoja."); }
}

/* ---------- Eventos ---------- */
function gValid(){ const g=S.gForm; return g.name.trim() && digits(g.phone).length>=9 && g.address.trim(); }
function gCheck(){ if(!gValid()){ toast("Completa nombre, teléfono y dirección."); return false; } if(S.gForm.when==="ahora" && !S.gForm.paidOk){ toast("Marca «Ya hice el pago» o elige pagar al recibir."); return false; } return true; }
function updateWaLink(){ const a=document.getElementById("waSend"); if(a) a.href=waTo(S.config.waPhone,deliveryMsg(S.gForm,S.cart)); }
$root.addEventListener("click", async ev=>{
  const gg=ev.target.closest("[data-go]"); if(gg){ go(gg.dataset.go); return; }
  const el=ev.target.closest("[data-act]"); if(!el) return;
  if(el.dataset.act==="closeCart" && ev.target.closest("[data-stop]") && !ev.target.closest("button[data-act=closeCart]")) return;
  const a=el.dataset.act, d=el.dataset;
  const findD = id => S.deliveries.find(x=>x.id===id);
  switch(a){
    case "jump": ev.preventDefault(); { const s=document.getElementById("c-"+d.cat); if(s) s.scrollIntoView({behavior:"smooth",block:"start"}); } break;
    case "add": addTo(S.cart,d.id,S.delivery?"dom":"local"); S.sent=null; render(); break;
    case "dec": { const i=S.cart.map(l=>l.id).lastIndexOf(d.id); if(i>-1){ S.cart[i].qty--; if(!S.cart[i].qty) S.cart.splice(i,1);} render(); } break;
    case "cinc": S.cart[+d.i].qty++; render(); break;
    case "cdec": S.cart[+d.i].qty--; if(!S.cart[+d.i].qty) S.cart.splice(+d.i,1); if(!S.cart.length) S.cartOpen=false; render(); break;
    case "openCart": S.cartOpen=true; render(); break;
    case "closeCart": S.cartOpen=false; render(); break;
    case "send": {
      const live=canLive();
      if(live){ const ok=await sendOrder(S.table,S.cart,"mesa"); if(ok){ S.sent={live:true}; S.cart=[]; S.cartOpen=false; render(); window.scrollTo(0,0);} }
      else { S.sent={live:false,code:"M"+S.table+"-"+codeBody(S.cart),text:S.cart.map(l=>`${l.qty}x ${l.name}${l.note?" ("+l.note+")":""}`).join("\n")}; S.cartOpen=false; render(); window.scrollTo(0,0); }
    } break;
    case "waSend": {
      if(!gCheck()){ ev.preventDefault(); break; }
      updateWaLink(); S.sent={live:false,text:deliveryMsg(S.gForm,S.cart)}; setTimeout(()=>{ S.cartOpen=false; S.cart=[]; render(); window.scrollTo(0,0); },300);
    } break;
    case "gsendLive": {
      if(!gCheck()) break;
      const ok=await createDelivery(Object.assign({channel:"Web"},S.gForm),S.cart,"cliente"); if(ok){ S.sent={live:true}; S.cart=[]; S.cartOpen=false; render(); window.scrollTo(0,0); }
    } break;
    case "routeToggle": { S.routeSel=S.routeSel||[]; const i=S.routeSel.indexOf(d.id); if(el.checked&&i<0) S.routeSel.push(d.id); if(!el.checked&&i>-1) S.routeSel.splice(i,1); render(); } break;
    case "routeZone": { const list=S.deliveries.filter(x=>x.status!=="cancelado"&&dInfo(x).stage!=="camino"&&zoneOf(x)===d.z).map(x=>x.id); S.routeSel=S.routeSel||[];
      const all=list.every(id=>S.routeSel.includes(id)); S.routeSel = all ? S.routeSel.filter(id=>!list.includes(id)) : [...new Set(S.routeSel.concat(list))]; render(); } break;
    case "routeDispatch": {
      const driver=(S.routeDriver||"").trim(); if(!driver){ toast("Escribe quién lleva el viaje."); break; }
      const go2=S.deliveries.filter(x=>(S.routeSel||[]).includes(x.id)&&dInfo(x).stage==="listo");
      for(const x of go2){ S.drivers[x.id]=driver; await dispatch(x); }
      S.routeSel=(S.routeSel||[]).filter(id=>!go2.some(x=>x.id===id)); toast(`${go2.length} domicilio${go2.length===1?"":"s"} en camino con ${driver}`); render(); } break;
    case "theme": setTheme(d.v); render(); break;
    case "dTab": S.dTab=d.v; render(); window.scrollTo(0,0); break;
    case "custSort": S.custSort=d.v; render(); break;
    case "custOpen": { const c=S.customers.find(x=>x.id===d.k); if(!c) break; S.custSel=c.id; S.custEdit={name:c.name||"",address:c.address||"",barrio:c.barrio||"",notes:c.notes||"",consent:!!c.consent}; S.dTab="clientes"; if(S.view!=="domicilios") go("domicilios"); else { render(); window.scrollTo(0,0); } } break;
    case "custClose": S.custSel=null; render(); break;
    case "ceConsent": if(S.custEdit) S.custEdit.consent=el.checked; break;
    case "custSave": { const c=S.customers.find(x=>x.id===S.custSel), e=S.custEdit; if(!c||!e) break;
      w(db=>db.doc("customers/"+c.id).set(Object.assign({},c,{id:undefined},{name:e.name.trim(),address:e.address.trim(),barrio:e.barrio.trim(),notes:e.notes.trim(),consent:!!e.consent,consentAt:e.consent&&!c.consent?Date.now():(e.consent?c.consentAt||null:null)})),"Ficha guardada"); } break;
    case "useHabit": { const c=S.customers.find(x=>x.id===d.k); if(!c) break;
      Object.assign(S.dForm,{name:c.name||"",phone:c.phone||"",address:c.address||"",barrio:c.barrio||"",notes:c.notes||S.dForm.notes,consent:!!c.consent});
      S.dCart=[]; habitual(c).forEach(x=>{ for(let i=0;i<x.qty;i++) addTo(S.dCart,x.id,"dom"); });
      S.dTab="pedidos"; render(); window.scrollTo(0,0); toast(S.dCart.length?"Pedido habitual cargado: revisa y registra":"Datos cargados"); } break;
    case "gConsent": S.gForm.consent=el.checked; updateWaLink(); break;
    case "dConsent": S.dForm.consent=el.checked; break;
    case "campNew": S.campNew=true; render(); break;
    case "campCancel": S.campNew=false; render(); break;
    case "campOpen": S.campSel=d.id; S.campNew=false; render(); break;
    case "cmAud": S.cmp.audience=d.v; render(); break;
    case "campCreate": createCampaign(); break;
    case "campSend": { const cm=S.campaigns.find(x=>x.id===d.id); if(!cm) break; const sent=Object.assign({},cm.sent||{},{[d.k]:Date.now()}); w(db=>db.doc("campaigns/"+cm.id).update({sent})); } break;
    case "campUnpin": w(db=>db.doc("config/main").set(Object.assign({},S.config,{promo:null})),"Quitada del menú"); break;
    case "campPin": { const cm=S.campaigns.find(x=>x.id===d.id); if(!cm) break; const until=Date.now()+3*86400000;
      w(async db=>{ await db.doc("config/main").set(Object.assign({},S.config,{promo:{campaignId:cm.id,dishId:cm.dishId,title:cm.title,price:cm.price||null,until}})); if((cm.until||0)<until) await db.doc("campaigns/"+cm.id).update({until}); },"Destacada en el menú 3 días"); } break;
    case "campEnd": { const cm=S.campaigns.find(x=>x.id===d.id); if(!cm) break;
      w(async db=>{ await db.doc("campaigns/"+cm.id).update({until:Date.now()-1}); if(S.config.promo&&S.config.promo.campaignId===cm.id) await db.doc("config/main").set(Object.assign({},S.config,{promo:null})); },"Campaña terminada"); } break;
    case "period": S.period=d.v; S.pOff=0; if(d.v==="rango"&&!S.rFrom){ const t=new Date(), a=new Date(); a.setDate(t.getDate()-29); S.rFrom=dayKey(a); S.rTo=dayKey(t); } render(); break;
    case "pNav": S.pOff=Math.min(0,S.pOff+(+d.v)); if(S.period==="rango"&&S.pOff!==0){ const R=periodRange("rango",S.pOff); S.rFrom=dayKey(R.a); S.rTo=dayKey(R.b); S.pOff=0; } render(); break;
    case "pQuick": { const t=new Date(); let a=new Date(); if(d.v==="y") a=new Date(t.getFullYear(),0,1); else a.setDate(t.getDate()-(+d.v-1)); S.rFrom=dayKey(a); S.rTo=dayKey(t); S.pOff=0; render(); } break;
    case "logout": if(HOST){ try{ await HOST.signOut(); }catch(e){} location.reload(); } break;
    case "closeAsk": S.confirmClose=true; render(); break;
    case "closeNo": S.confirmClose=false; render(); break;
    case "closeYes": saveClosing(); break;
    case "gWhen": S.gForm.when=d.v; S.gForm.paidOk=false; render(); break;
    case "gPay": S.gForm.pay=d.v; S.gForm.paidOk=false; render(); break;
    case "gPaid": S.gForm.paidOk=el.checked; updateWaLink(); break;
    case "dWhen": S.dForm.when=d.v; S.dForm.pay=(d.v==="ahora"?payNowOpts():DPAY)[0]; render(); break;
    case "verifyPay": { const x=S.deliveries.find(x=>x.id===d.id); if(x) verifyPay(x); } break;
    case "copySent":copy(S.sent.code?`${tname(S.table)} · código ${S.sent.code}\n${S.sent.text||""}`:S.sent.text,"Pedido copiado"); break;
    case "clearSent": S.sent=null; render(); break;
    case "call": callFor(S.table,d.type); break;
    case "doneCall": doneCall(d.id); break;
    case "status": S.newIds.delete(d.id); setStatus(d.id,d.st); break;
    case "selTable": S.selTable = +d.t===-99?null:+d.t; S.staffCart=[]; render(); break;
    case "pickCat": S.pickCat=d.c; render(); break;
    case "dPick": S.dPick=d.c; render(); break;
    case "sadd": addTo(S.staffCart,d.id); render(); break;
    case "dadd": addTo(S.dCart,d.id,"dom"); render(); break;
    case "sinc": S.staffCart[+d.i].qty++; render(); break;
    case "sdec": S.staffCart[+d.i].qty--; if(!S.staffCart[+d.i].qty) S.staffCart.splice(+d.i,1); render(); break;
    case "dinc": S.dCart[+d.i].qty++; render(); break;
    case "ddec": S.dCart[+d.i].qty--; if(!S.dCart[+d.i].qty) S.dCart.splice(+d.i,1); render(); break;
    case "ssend": { const ok=await sendOrder(S.selTable,S.staffCart,"camarero"); if(ok){ S.staffCart=[]; toast("Pedido enviado a cocina y barra"); } } break;
    case "loadCode": { const p=parseCode(S.codeIn); if(!p){ toast("Código no válido: debe empezar por M y el número de mesa."); break; } S.codeIn="";
      if(p.table<0){ S.dCart=p.cart; go("domicilios"); toast("Pedido de domicilio cargado: completa los datos"); break; }
      S.selTable=p.table; S.staffCart=p.cart; render(); toast("Pedido cargado: revisa y envía"); } break;
    case "readMsg": { const r=parseWhatsApp(S.dPaste); const f=r.form; ["name","phone","address","barrio","notes","cashFor"].forEach(k=>{ if(f[k]) S.dForm[k]=f[k]; }); S.dForm.when=f.when; S.dForm.consent=!!f.consent; if(f.pay) S.dForm.pay=f.pay; S.dForm.channel="WhatsApp";
      if(r.cart&&r.cart.length){ S.dCart=r.cart; toast("Pedido leído: revisa y registra"); } else toast(f.name?"Datos leídos. No vino código: agrega los productos a mano.":"No encontré datos en el mensaje.");
      render(); } break;
    case "dsend": {
      const f=S.dForm; if(!f.name.trim()||!f.address.trim()){ toast("Falta nombre o dirección."); break; }
      const ok=await createDelivery(f,S.dCart,"equipo"); if(ok){ S.dCart=[]; S.dPaste=""; S.dForm={name:"",phone:"",address:"",barrio:"",notes:"",channel:"WhatsApp",when:"entrega",pay:"Efectivo",cashFor:"",consent:false}; toast("Domicilio registrado y enviado a cocina"); render(); }
    } break;
    case "dispatch": { const x=findD(d.id); if(x) dispatch(x); } break;
    case "dlAsk": S.confirmDl=d.id; render(); break;
    case "dlNo": S.confirmDl=null; render(); break;
    case "dlYes": { const x=findD(d.id); if(x) deliver(x); } break;
    case "cancelDl": S.cancelDl=d.id; render(); break;
    case "cancelNo": S.cancelDl=null; render(); break;
    case "cancelYes": { const x=findD(d.id); if(x) cancelDelivery(x); } break;
    case "hist": S.histOpen = S.histOpen===d.id?null:d.id; render(); break;
    case "copyWelcome": copy(welcomeMsg(),"Mensaje copiado"); break;
    case "copyTpl": { const t=WA_TEMPLATES().find(x=>x.k===d.k); if(t) copy(t.text,"Mensaje copiado"); } break;
    case "copyDomLink": copy(baseLink()+"#domicilio","Link copiado"); break;
    case "menuTab": S.menuTab=d.v; S.cart=[]; S.sent=null; S.q=""; render(); break;
    case "toCaja": S.cajaSel=+d.t; S.confirmPay=false; S.received=""; S.split=1; go("caja"); break;
    case "station": S.station=d.v; render(); break;
    case "sound": try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); await actx.resume(); S.sound=!S.sound; if(S.sound) beep(); }catch(e){} render(); break;
    case "full": try{ await document.documentElement.requestFullscreen(); }catch(e){ toast("Este dispositivo no permite pantalla completa."); } try{ await navigator.wakeLock.request("screen"); }catch(e){} break;
    case "cajaSel": S.cajaSel=+d.t; S.confirmPay=false; S.received=""; S.split=1; render(); break;
    case "split": S.split=Math.max(1,Math.min(20,S.split+(+d.d))); render(); break;
    case "method": S.method=d.m; S.confirmPay=false; render(); break;
    case "recvq": S.received=String(Math.round(+d.v*100)); render(); break;
    case "key": { if(d.k==="⌫") S.received=S.received.slice(0,-1); else if(S.received.length<8) S.received=(S.received+d.k).replace(/^0+/,""); render(); } break;
    case "pay": S.confirmPay=true; render(); break;
    case "payNo": S.confirmPay=false; render(); break;
    case "payYes": {
      const t=S.cajaSel, x=tableInfo(t), sub=x.total, tip=tipOf(sub), tot=r2(sub+tip), rec=(+S.received||0)/100;
      const ok=await w(async db=>{
        await db.collection("payments").add({table:t,kind:"sala",orderIds:x.os.map(o=>o.id),subtotal:sub,tip,total:tot,method:S.method,received:S.method==="Efectivo"?(rec||tot):tot,change:S.method==="Efectivo"&&rec?r2(rec-tot):0,split:S.split,createdAt:Date.now()});
        for(const o of x.os) await db.doc("orders/"+o.id).update({paid:true,paidAt:Date.now()});
        for(const c of x.cs) await db.doc("calls/"+c.id).update({done:true,doneAt:Date.now()});
      }, `${tname(t)} cobrada · ${money(tot)}`);
      if(ok){ S.cajaSel=null; S.confirmPay=false; S.received=""; S.split=1; render(); }
    } break;
    case "saveCfg": {
      const tables=Math.max(1,Math.min(60,+document.getElementById("cfgTables").value||10));
      const link=document.getElementById("cfgLink").value.trim(), waPhone=digits(document.getElementById("cfgWa").value), deliveryFee=r2(document.getElementById("cfgFee").value);
      const bizum=digits(document.getElementById("cfgBizum").value), iban=document.getElementById("cfgIban").value.trim().toUpperCase(), payLink=document.getElementById("cfgPayLink").value.trim();
      if(payLink && !/^https:\/\//i.test(payLink)){ toast("El link de pago debe empezar por https://"); break; }
      const address=document.getElementById("cfgAddr").value.trim(), city=document.getElementById("cfgCity").value.trim()||"Barcelona";
      w(db=>db.doc("config/main").set(Object.assign({},S.config,{tables,link,waPhone,deliveryFee,bizum,iban,payLink,address,city})),"Ajustes guardados");
    } break;
    case "dlQR": downloadSheet(); break;
    case "demo": S.confirmDemo=true; render(); break;
    case "demoNo": S.confirmDemo=false; render(); break;
    case "demoYes": { await w(async db=>{ for(const o of S.orders.filter(o=>o.demo)) await db.doc("orders/"+o.id).delete(); for(const c of S.calls.filter(c=>c.demo)) await db.doc("calls/"+c.id).delete(); for(const x of S.deliveries.filter(x=>x.demo)) await db.doc("deliveries/"+x.id).delete(); },"Pedidos de ejemplo eliminados"); S.confirmDemo=false; render(); } break;
    case "addItem": {
      const name=document.getElementById("nName").value.trim(), cat=document.getElementById("nCat").value.trim()||"Otros", price=r2(document.getElementById("nPrice").value), st=document.getElementById("nSt").value;
      if(!name||!price){ toast("Escribe nombre y precio."); break; }
      const id="X"+Date.now().toString(36).toUpperCase().slice(-5);
      const nd=document.getElementById("nDom"), nl=document.getElementById("nLocal");
      w(db=>db.doc("menu/"+id).set({name,cat,price,station:st,desc:"",available:true,dom:nd?nd.checked:true,local:nl?nl.checked:true}),"Producto agregado");
    } break;
  }
});
$root.addEventListener("input", ev=>{
  const t=ev.target;
  if(t.dataset.note!==undefined){ S.cart[+t.dataset.note].note=t.value; updateWaLink(); }
  else if(t.dataset.cnote){ const c=t.dataset.cnote==="s"?S.staffCart:S.dCart; if(c[+t.dataset.i]) c[+t.dataset.i].note=t.value; }
  else if(t.dataset.gform){ S.gForm[t.dataset.gform]=t.value; updateWaLink(); }
  else if(t.dataset.dform){ S.dForm[t.dataset.dform]=t.value; }
  else if(t.dataset.ce){ if(S.custEdit) S.custEdit[t.dataset.ce]=t.value; }
  else if(t.dataset.cm){ S.cmp[t.dataset.cm]=t.value; if(t.tagName==="SELECT"){ if(t.dataset.cm==="valid"){ S.cmp.banner=t.value!=="0"; } render(); } }
  else if(t.dataset.bind==="custQ"){ S.custQ=t.value; render(); }
  else if(t.dataset.cf){ S.cf[t.dataset.cf]=t.value; }
  else if(t.dataset.driver){ S.drivers[t.dataset.driver]=t.value; }
  else if(t.dataset.bind==="q"){ S.q=t.value; const pos=t.selectionStart; render(); const n=document.getElementById("q"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }
  else if(t.dataset.bind){ S[t.dataset.bind]=t.value; if(t.dataset.bind==="dPaste"){ const b=document.querySelector('[data-act="readMsg"]'); if(b) b.disabled=!t.value.trim(); } }
});
$root.addEventListener("change", ev=>{
  const t=ev.target;
  if(t.dataset.act==="tip"){ S.tip=t.checked; render(); return; }
  if(t.dataset.act==="pFrom"||t.dataset.act==="pTo"){ if(t.value){ S[t.dataset.act==="pFrom"?"rFrom":"rTo"]=t.value; S.pOff=0; } render(); return; }
  if(t.dataset.cf){ render(); return; }
  if(t.id==="dPhone"||t.id==="cmPrice"||t.id==="cmMsg"){ render(); return; }
  if(t.dataset.mfield){
    const id=t.dataset.id, f=t.dataset.mfield, v = (f==="available"||f==="dom"||f==="local")?t.checked : f==="price"?Math.max(0,r2(t.value)) : f==="domPrice"?(t.value===""?null:Math.max(0,r2(t.value))) : t.value;
    const base=item(id)||{}; const cur=Object.assign({},S.menuDb[id]||{});
    if(!BASE_MENU.find(b=>b.id===id)) Object.assign(cur,{name:base.name,cat:base.cat,price:base.price,station:base.station,desc:base.desc||"",available:base.available!==false});
    cur[f]=v;
    w(db=>db.doc("menu/"+id).set(cur), f==="available"?(v?"Disponible otra vez":"Marcado como agotado"):f==="dom"?(v?"Ahora se ofrece a domicilio":"Quitado del menú a domicilio"):f==="local"?(v?"Ahora está en el menú del local":"Quitado del menú del local"):"Guardado");
  }
});
$root.addEventListener("submit", async ev=>{
  if(ev.target.id!=="loginForm") return;
  ev.preventDefault();
  const email=document.getElementById("lgEmail").value.trim(), pass=document.getElementById("lgPass").value;
  if(!email||!pass){ S.loginErr="Escribe tu correo y contraseña."; render(); return; }
  S.loginBusy=true; S.loginErr=""; render();
  try{ await HOST.signIn(email,pass); S.loginBusy=false; S.dbState="loading"; render(); }
  catch(e){ S.loginBusy=false; S.loginErr = /network/i.test(e&&e.code||"") ? "Sin conexión. Revisa internet." : /too-many/i.test(e&&e.code||"") ? "Demasiados intentos. Espera un momento." : "Correo o contraseña incorrectos."; render(); }
});
$root.addEventListener("keydown", ev=>{ if(ev.key==="Enter" && ev.target.id==="codeIn"){ ev.preventDefault(); const b=document.querySelector('[data-act="loadCode"]'); if(b) b.click(); } });
setInterval(()=>{ const c=document.getElementById("clk"); if(c) c.textContent=clock(); if(S.view!=="ajustes" && !S.cartOpen) queueRender(); },20000);
render();
})();
</script>

</body>
</html>
