<script>
/* Datos de ejemplo para la demo: viven solo en memoria y se reinician al recargar. */
(function(){
  const now=Date.now(), M=60000, ago=m=>now-m*M;
  const open8=new Date(now); open8.setHours(8,0,0,0); const span=Math.max(now-open8.getTime(), 100*M);
  const hist=m=>Math.round(now-(m/310)*span); // reparte lo ya cobrado entre la apertura y ahora
  const day=d=>{ const x=new Date(now-d*86400000); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
  const it=(id,name,price,qty,note)=>({id,name,price,qty,note:note||""});
  const store={orders:{},calls:{},deliveries:{},payments:{},menu:{},closings:{},config:{}};
  const O=(id,o)=>store.orders[id]=Object.assign({paid:false,demo:true},o);

  // En curso ahora
  O("a1",{table:2,station:"cocina",items:[it("R1","Calentado paisa",11.5,2,"Uno sin chicharrón")],status:"preparando",createdAt:ago(12),source:"mesa"});
  O("a2",{table:2,station:"barra",items:[it("B1","Café de olla",2.8,2)],status:"listo",createdAt:ago(12),listoAt:ago(3),source:"mesa"});
  O("a3",{table:5,station:"cocina",items:[it("A1","Empanadas x3",6,1),it("A2","Arepa de choclo",6.5,1,"Extra quesito")],status:"nuevo",createdAt:ago(3),source:"camarero"});
  O("a4",{table:7,station:"barra",items:[it("C3","Capuchino",2.5,1,"Sin lactosa"),it("A4","Pandebono",1.8,2)],status:"entregado",createdAt:ago(30),source:"mesa"});
  O("a5",{table:4,station:"cocina",items:[it("R4","Tamal tolimense",8.5,1)],status:"nuevo",createdAt:ago(17),source:"mesa"});
  O("a6",{table:0,station:"barra",items:[it("C1","Tinto",1.5,2),it("A6","Buñuelo",1.5,2)],status:"preparando",createdAt:ago(4),source:"camarero"});
  store.calls.c1={table:7,type:"cuenta",createdAt:ago(1),done:false,demo:true};
  store.calls.c2={table:3,type:"mesero",createdAt:ago(2),done:false,demo:true};

  // Domicilios en curso
  const D=(id,d,orders)=>{ store.deliveries[id]=Object.assign({paid:false,demo:true,notes:"",fee:3,cashFor:0,prepaid:false,payVerified:false},d);
    orders.forEach((o,i)=>O(id+"o"+i,Object.assign({table:-1,label:"Domicilio · "+d.name.split(" ")[0],delivery:id,createdAt:d.createdAt,source:"domicilio"},o))); };
  D("d1",{name:"Laura Gómez",phone:"612345678",address:"C/ de Sants 120, 3º 2ª",barrio:"Sants",channel:"WhatsApp",pay:"Efectivo",cashFor:20,items:[it("A1","Empanadas x3",6,2)],subtotal:12,total:15,status:"recibido",createdAt:ago(9),log:[{at:ago(9),what:"Pedido recibido por WhatsApp · paga al recibir con Efectivo"}]},
    [{station:"cocina",items:[it("A1","Empanadas x3",6,2)],status:"preparando"}]);
  D("d2",{name:"Andrés Rojas",phone:"698765432",address:"Carrer de Muntaner 45, 1º",barrio:"08011",notes:"El timbre no funciona, llamar",channel:"Instagram",pay:"Bizum",prepaid:true,items:[it("R4","Tamal tolimense",8.5,2)],subtotal:17,total:20,status:"recibido",createdAt:ago(22),log:[{at:ago(22),what:"Pedido recibido por Instagram · pago por adelantado con Bizum"}]},
    [{station:"cocina",items:[it("R4","Tamal tolimense",8.5,2)],status:"listo",listoAt:ago(4)}]);
  D("d3",{name:"Marta Pérez",phone:"655111222",address:"Av. Paral·lel 80",barrio:"Poble-sec",channel:"Teléfono",pay:"Tarjeta (datáfono)",items:[it("A3","Patacón con hogao",7,1)],subtotal:7,total:10,status:"en camino",driver:"Kevin",dispatchedAt:ago(8),createdAt:ago(35),log:[{at:ago(35),what:"Pedido recibido por Teléfono · paga al recibir con Tarjeta (datáfono)"},{at:ago(8),what:"Sale con Kevin"}]},
    [{station:"cocina",items:[it("A3","Patacón con hogao",7,1)],status:"entregado"}]);

  D("d5",{name:"Sofía Martín",phone:"633444555",address:"C/ Vilamarí 61, 2º",barrio:"Sants",channel:"WhatsApp",pay:"Bizum",prepaid:true,payVerified:true,items:[it("B3","Lulada",4,2),it("A2","Arepa de choclo",6.5,1)],subtotal:14.5,total:17.5,status:"recibido",createdAt:ago(18),log:[{at:ago(18),what:"Pedido recibido por WhatsApp · pago por adelantado con Bizum"},{at:ago(16),what:"Pago verificado · Bizum"}]},
    [{station:"barra",items:[it("B3","Lulada",4,2)],status:"listo",listoAt:ago(6)},{station:"cocina",items:[it("A2","Arepa de choclo",6.5,1)],status:"listo",listoAt:ago(5)}]);
  D("d6",{name:"Pau Ferrer",phone:"644555666",address:"C/ de Blesa 9",barrio:"Poble-sec",channel:"Web",pay:"Efectivo",cashFor:50,items:[it("R1","Calentado paisa",11.5,1),it("B1","Café de olla",2.8,1)],subtotal:14.3,total:17.3,status:"recibido",createdAt:ago(14),log:[{at:ago(14),what:"Pedido recibido por Web · paga al recibir con Efectivo"}]},
    [{station:"cocina",items:[it("R1","Calentado paisa",11.5,1)],status:"listo",listoAt:ago(2)},{station:"barra",items:[it("B1","Café de olla",2.8,1)],status:"listo",listoAt:ago(7)}]);
  D("d7",{name:"Nuria Vidal",phone:"677888999",address:"C/ de Tamarit 150",barrio:"Sant Antoni",channel:"Teléfono",pay:"Tarjeta (datáfono)",items:[it("A1","Empanadas x3",6,1)],subtotal:6,total:9,status:"recibido",createdAt:ago(5),log:[{at:ago(5),what:"Pedido recibido por Teléfono · paga al recibir con Tarjeta (datáfono)"}]},
    [{station:"cocina",items:[it("A1","Empanadas x3",6,1)],status:"nuevo"}]);

  // Lo que ya pasó hoy (cobrado)
  const done=[[300,1,"C1","Tinto",1.5,3,"Efectivo"],[285,3,"A4","Pandebono",1.8,4,"Tarjeta"],[250,6,"R1","Calentado paisa",11.5,2,"Tarjeta"],[230,1,"C3","Capuchino",2.5,2,"Bizum"],
    [200,4,"A1","Empanadas x3",6,2,"Efectivo"],[190,8,"B3","Lulada",4,2,"Tarjeta"],[160,2,"R4","Tamal tolimense",8.5,1,"Efectivo"],[130,5,"A2","Arepa de choclo",6.5,3,"Tarjeta"],
    [110,9,"C1","Tinto",1.5,2,"Efectivo"],[90,3,"A1","Empanadas x3",6,1,"Bizum"],[70,6,"B5","Chocolate santafereño",5.5,2,"Tarjeta"],[50,10,"A6","Buñuelo",1.5,5,"Efectivo"]];
  done.forEach(([m,t,id,name,price,qty,method],i)=>{
    O("h"+i,{table:t,station:"cocina",items:[it(id,name,price,qty)],status:"entregado",createdAt:hist(m),listoAt:hist(m)+(7+i%6)*M,paid:true,demo:false});
    store.payments["p"+i]={table:t,kind:"sala",total:Math.round(price*qty*100)/100,tip:0,method,createdAt:Math.min(now,hist(m)+25*M)};
  });
  store.deliveries.d4={name:"Jordi Puig",phone:"600000001",address:"C/ Blai 12",barrio:"Poble-sec",channel:"WhatsApp",pay:"Bizum",prepaid:true,payVerified:true,items:[it("A1","Empanadas x3",6,1)],subtotal:6,fee:3,total:9,status:"entregado",driver:"Kevin",createdAt:hist(140),dispatchedAt:hist(140)+20*M,deliveredAt:hist(140)+32*M,paid:true,
    log:[{at:hist(140),what:"Pedido recibido por WhatsApp · pago por adelantado con Bizum"},{at:hist(140)+4*M,what:"Pago verificado · Bizum"},{at:hist(140)+20*M,what:"Sale con Kevin"},{at:hist(140)+32*M,what:"Entregado (pagado por adelantado · Bizum)"}]};
  store.payments.pd={table:-1,label:"Domicilio · Jordi Puig",kind:"domicilio",prepaid:true,total:9,tip:0,method:"Bizum",createdAt:hist(140)+32*M};

  // Cierres de días anteriores (unos 4 meses, con detalle para el panel por periodo)
  (function(){
    let seed=11; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
    const MENU=[["Empanadas x3",6,14],["Arepa de choclo",6.5,10],["Calentado paisa",11.5,7],["Huevos pericos",7.5,6],["Tamal tolimense",8.5,5],
      ["Patacón con hogao",7,6],["Changua",7,3],["Tinto",1.5,22],["Café con leche",2,14],["Capuchino",2.5,11],["Café de olla",2.8,8],["Lulada",4,9],
      ["Avena helada",3,6],["Chocolate santafereño",5.5,5],["Pandebono",1.8,16],["Almojábana",1.8,10],["Buñuelo",1.5,12],["Obleas",4,4],["Arroz con leche",3.5,4]];
    const WK=[1.4,0.65,0.75,0.8,0.95,1.25,1.6]; // domingo..sábado
    const HR=[4,6,4,3,3,5,7,5,3,3,5,6,4,2,1]; // 8..22 (café de mañana y merienda)
    for(let i=1;i<=125;i++){
      const dt=new Date(now-i*86400000); dt.setHours(21,30,0,0);
      const f=WK[dt.getDay()]*(0.85+rnd()*0.3)*(1+(125-i)*0.0018);
      const top=MENU.map(([n,p,w])=>({name:n,price:p,qty:Math.max(0,Math.round(w*f*(0.7+rnd()*0.6)))}));
      const sales=Math.round(top.reduce((a,x)=>a+x.price*x.qty,0)*100)/100;
      const domShare=0.16+rnd()*0.12, domSales=Math.round(sales*domShare*100)/100;
      const payCount=Math.max(1,Math.round(sales/(11+rnd()*4))), domOrders=Math.round(payCount*domShare*0.7), salaTickets=payCount-domOrders;
      const card=Math.round(sales*(0.48+rnd()*0.08)*100)/100, bizum=Math.round(sales*(0.15+rnd()*0.06)*100)/100, transf=rnd()<0.15?Math.round(sales*0.02*100)/100:0;
      const cash=Math.round((sales-card-bizum-transf)*100)/100;
      const totH=HR.reduce((a,b)=>a+b,0), perH=HR.map(h=>Math.round(h/totH*payCount*(0.6+rnd()*0.8)));
      const r=rnd(), diff=r<0.72?0:r<0.86?-Math.round(rnd()*500)/100:Math.round(rnd()*300)/100;
      store.closings[day(i)]={date:day(i),closedAt:dt.getTime(),orders:payCount,salaTickets,domOrders,cancelled:rnd()<0.2?1:0,sales,salaSales:Math.round((sales-domSales)*100)/100,domSales,
        tips:Math.round(sales*0.02*100)/100,payCount,byMethod:{Efectivo:cash,Tarjeta:card,Bizum:bizum,Transferencia:transf},diff,
        notes:diff<-2?"Faltan "+(-diff).toFixed(2).replace(".",",")+" € en monedas":"",kitchenAvg:Math.round(8+rnd()*6),delivAvg:Math.round(26+rnd()*10),
        perH,top:top.map(({name,qty})=>({name,qty})).sort((a,b)=>b.qty-a.qty)};
    }
  })();

  // Clientes con historial (fichas) y una campaña de ejemplo
  (function(){
    let seed=23; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
    const P={A1:["Empanadas x3",6],A2:["Arepa de choclo",6.5],R1:["Calentado paisa",11.5],R2:["Huevos pericos",7.5],R4:["Tamal tolimense",8.5],A3:["Patacón con hogao",7],
      B3:["Lulada",4],B1:["Café de olla",2.8],B5:["Chocolate santafereño",5.5],A4:["Pandebono",1.8],A6:["Buñuelo",1.5],P1:["Obleas",4]};
    const people=[
      ["Laura Gómez","612345678","C/ de Sants 120, 3º 2ª","Sants",true,["A1","B3"],9,"Sin cebolla en el hogao"],
      ["Andrés Rojas","698765432","Carrer de Muntaner 45, 1º","08011",true,["R4","B1"],6,"El timbre no funciona, llamar"],
      ["Marta Pérez","655111222","Av. Paral·lel 80","Poble-sec",false,["A3","A1"],4,""],
      ["Sofía Martín","633444555","C/ Vilamarí 61, 2º","Sants",true,["B3","A2"],7,""],
      ["Pau Ferrer","644555666","C/ de Blesa 9","Poble-sec",true,["R1","B1"],5,"Le gusta el ají aparte"],
      ["Nuria Vidal","677888999","C/ de Tamarit 150","Sant Antoni",true,["A1"],3,""],
      ["Jordi Puig","600000001","C/ Blai 12","Poble-sec",true,["A1","A4"],8,""],
      ["Camila Torres","611222333","C/ Mallorca 200, 4º 1ª","08036",true,["R1","B3"],11,"Celíaca: avisar en cocina"],
      ["Diego Herrera","622111444","C/ de Girona 30","Eixample",true,["R2","B5"],5,""],
      ["Valentina Ruiz","633222555","Ronda de Sant Antoni 50","Sant Antoni",true,["A2","B3","A6"],6,""],
      ["Óscar Medina","644333666","C/ de Viladomat 88","Sant Antoni",false,["R1"],2,""],
      ["Lucía Blanco","655444777","C/ de Creu Coberta 14","Sants",true,["A4","B1","A6"],12,""],
      ["Santiago López","666555888","Av. de Mistral 22","Sant Antoni",true,["R4"],2,""],
      ["Paula Navarro","677666999","C/ de Calàbria 101","Eixample",true,["P1","B5"],4,""],
      ["Felipe Castro","688777000","C/ del Poeta Cabanyes 7","Poble-sec",true,["R1","A1"],3,""],
      ["Elena Sanz","699888111","C/ de Sepúlveda 60","Sant Antoni",false,["A2"],1,""],
      ["Mateo Rincón","610999222","C/ de Valladolid 5","Sants",true,["A3","B3"],2,""],
      ["Isabel Prieto","621000333","Gran Via 400","Eixample",true,["R2"],1,""]];
    const DAY=86400000;
    store.customers={};
    people.forEach(([name,phone,address,barrio,consent,fav,n,notes],pi)=>{
      const items={}, history=[]; let spent=0;
      const recency = pi===10||pi===13||pi===15 ? 40+pi : pi%5; // algunos llevan tiempo sin pedir
      for(let k=0;k<n;k++){
        const at=now-(recency+k*(4+pi%5)+rnd()*2)*DAY - rnd()*3600000;
        const lines=fav.map(id=>({id,name:P[id][0],price:P[id][1],qty:1+Math.floor(rnd()*2)}));
        if(rnd()<0.3){ const ex=Object.keys(P)[Math.floor(rnd()*12)]; lines.push({id:ex,name:P[ex][0],price:P[ex][1],qty:1}); }
        const total=Math.round((lines.reduce((a,l)=>a+l.price*l.qty,0)+3)*100)/100; spent+=total;
        lines.forEach(l=>{ const x=items[l.id]||{name:l.name,qty:0}; x.qty+=l.qty; items[l.id]=x; });
        if(history.length<15) history.push({at,id:"h"+pi+"_"+k,total,ids:lines.map(l=>l.id),txt:lines.map(l=>l.qty+"× "+l.name).join(", ")});
      }
      history.sort((a,b)=>b.at-a.at);
      store.customers[phone]={name,phone,address,barrio,notes,consent,consentAt:consent?now-90*DAY:null,orders:n,spent:Math.round(spent*100)/100,
        firstAt:history[history.length-1].at,lastAt:history[0].at,items,history,channel:"WhatsApp"};
    });
    // campaña: Calentado paisa en promo, creada hace 2 días
    const cAt=now-2*DAY, rec=Object.keys(store.customers).filter(k=>store.customers[k].consent).slice(0,10);
    const sent={}; rec.slice(0,7).forEach((k,i)=>sent[k]=cAt+(20+i*3)*60000);
    ["611222333","644555666","688777000"].forEach((k,i)=>{ const c=store.customers[k]; const at=cAt+(5+i*9)*3600000;
      c.history.unshift({at,id:"camp"+i,total:Math.round((9.9*(1+i%2)+4+3)*100)/100,ids:["R1","B3"],txt:(1+i%2)+"× Calentado paisa, 1× Lulada"}); c.orders++; c.lastAt=Math.max(c.lastAt,at);
      c.items.R1=c.items.R1||{name:"Calentado paisa",qty:0}; c.items.R1.qty+=1+i%2; });
    store.campaigns={k1:{title:"Calentado paisa a 9,90 €",dishId:"R1",dishName:"Calentado paisa",price:9.9,normalPrice:11.5,audience:"todos",days:30,barrio:"",
      msg:"Hola {nombre} 👋 Hoy en Hecho en mi Pueblo tenemos {plato}{precio}. Pídelo aquí 👉 {link}",createdAt:cAt,until:now+DAY,banner:true,recipients:rec,sent}};
  })();
  store.config.main={tables:10,link:"https://tatianaospinah-lang.github.io/P1-Hecho-en-mi-pueblo/",waPhone:"34687703593",deliveryFee:3,promo:{campaignId:"k1",dishId:"R1",title:"Calentado paisa a 9,90 €",price:9.9,until:now+86400000}};

  // Base de datos en memoria con la misma forma que la real
  const subs=[], fire=()=>subs.slice().forEach(s=>s());
  const snap=(id,d)=>({id,exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}});
  const newId=()=>"n"+Math.random().toString(36).slice(2,9);
  function q(col,f,ord,lim){ return {
    where:(a,op,v)=>q(col,f.concat([[a,op,v]]),ord,lim), orderBy:(a,dir)=>q(col,f,[a,dir||"asc"],lim), limit:n=>q(col,f,ord,n),
    onSnapshot(next){ const run=()=>{ let docs=Object.entries(store[col]||{}).filter(([,d])=>f.every(([a,op,v])=>op==="=="?d[a]===v:op===">="?d[a]>=v:true));
        if(ord) docs.sort((x,y)=>(x[1][ord[0]]>y[1][ord[0]]?1:-1)*(ord[1]==="desc"?-1:1)); if(lim) docs=docs.slice(0,lim);
        const ds=docs.map(([id,d])=>snap(id,d)); next({docs:ds,size:ds.length,empty:!ds.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}); };
      subs.push(run); setTimeout(run,0); return ()=>{ const i=subs.indexOf(run); if(i>-1) subs.splice(i,1); }; },
    add(d){ (store[col]=store[col]||{})[newId()]=JSON.parse(JSON.stringify(d)); fire(); return Promise.resolve(); },
    doc(id){ return ref(col,id||newId()); } }; }
  function ref(col,id){ return { id,
    get:()=>Promise.resolve(snap(id,(store[col]||{})[id])),
    set(d){ (store[col]=store[col]||{})[id]=JSON.parse(JSON.stringify(d)); fire(); return Promise.resolve(); },
    update(d){ if(!store[col]||!store[col][id]) return Promise.reject({code:"invalid_argument"}); Object.assign(store[col][id],JSON.parse(JSON.stringify(d))); fire(); return Promise.resolve(); },
    delete(){ if(store[col]) delete store[col][id]; fire(); return Promise.resolve(); },
    onSnapshot(next){ const run=()=>next(snap(id,(store[col]||{})[id])); subs.push(run); setTimeout(run,0); return ()=>{ const i=subs.indexOf(run); if(i>-1) subs.splice(i,1); }; } }; }
  window.__DEMO_DB={ collection:c=>q(c,[]), doc:p=>{ const [c,i]=p.split("/"); return ref(c,i); } };
})();

</script>

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fill:#9A4E28; --bg:#140D09; --surface:#1E1510; --surface-2:#241A14; --sunken:#0F0906; --ink:#F5ECE3; --ink-2:#D9C7B6; --muted:#A78F7C; --line:#33261D; --line-2:#463528;
  --accent:#E9A47A; --accent-vino:#F08C98; --ok:#6CCB97; --ok-bg:#13291D; --warn:#EDB24E; --warn-bg:#2E2410; --crit:#F57A6E; --crit-bg:#361613; --info:#8DB5EE; --info-bg:#122136;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --fill:#9A4E28; --bg:#140D09; --surface:#1E1510; --surface-2:#241A14; --sunken:#0F0906; --ink:#F5ECE3; --ink-2:#D9C7B6; --muted:#A78F7C; --line:#33261D; --line-2:#463528;
  --accent:#E9A47A; --accent-vino:#F08C98; --ok:#6CCB97; --ok-bg:#13291D; --warn:#EDB24E; --warn-bg:#2E2410; --crit:#F57A6E; --crit-bg:#361613; --info:#8DB5EE; --info-bg:#122136;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--cafe-deep)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--amarillo);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{margin:0;text-wrap:balance}
.tricolor{height:4px;background:linear-gradient(90deg,#F2B13F 0 50%,#124982 50% 75%,#C8102E 75% 100%)}

/* ---------- Shell del equipo ---------- */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--cafe-deep);color:#F6E9DA;display:flex;flex-direction:column;padding:20px 14px 16px max(14px,env(safe-area-inset-left,0px))}
.logo{padding:0 8px 14px;line-height:1}
.logo b{display:block;font-family:var(--f-brand);font-weight:400;font-size:19px;letter-spacing:.3px;color:#F6E9DA}
.logo b span{display:block;font-size:26px}
.logo small{display:block;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;opacity:.7;margin-top:6px}
.side .tricolor{border-radius:2px;margin:0 8px 16px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.5;padding:12px 12px 4px;font-weight:700}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:inherit;padding:10px 12px;border-radius:9px;font-weight:600;font-size:14px;opacity:.78;text-align:left}
.nav button:hover{opacity:1;background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{opacity:1;background:rgba(255,255,255,.12);box-shadow:inset 3px 0 0 #F2B13F}
.nav .cnt{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:#F2B13F;color:#2B1A10;font-size:11.5px;font-weight:800;display:grid;place-items:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;opacity:.85}
.themesw{display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:3px;gap:2px;margin-bottom:6px}
.themesw button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;border:0;background:transparent;color:inherit;opacity:.7;padding:6px 4px;border-radius:7px;font-size:12px;font-weight:600}
.themesw button svg.i{width:15px;height:15px}
.themesw button:hover{opacity:1}
.themesw button[aria-pressed="true"]{opacity:1;background:rgba(255,255,255,.18)}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:inherit;border-radius:999px;padding:5px 10px 5px 8px;font-size:12px;font-weight:600}
.tbtn svg.i{width:15px;height:15px}
.live{display:flex;align-items:center;gap:8px}
.live i{width:8px;height:8px;border-radius:50%;background:#6CCB97;box-shadow:0 0 0 3px rgba(108,203,151,.2)}
.live.off i{background:#F2B13F;box-shadow:0 0 0 3px rgba(242,177,63,.2)}
.content{min-width:0;padding:24px max(16px,env(safe-area-inset-right,0px)) 40px 28px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.pagehead p{margin:2px 0 0;color:var(--muted)}
.mtop{display:none;align-items:center;gap:10px;background:var(--cafe-deep);color:#F6E9DA;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:15}
.mtop b{font-family:var(--f-brand);font-weight:400;font-size:15px;letter-spacing:.3px;margin-right:auto}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:20}
  .logo,.side .tricolor,.side-foot,.nav .grp{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 2px;align-items:center;position:relative;width:auto;flex:1}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 #F2B13F}
  .nav .cnt{position:absolute;top:2px;right:calc(50% - 22px);margin:0;height:17px;min-width:17px;font-size:10px}
  .content{padding:18px max(16px,env(safe-area-inset-right,0px)) 100px max(16px,env(safe-area-inset-left,0px))}
  .mtop{display:flex}
}

/* ---------- Componentes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:700}
.card-b{padding:16px}
.label{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:9px 14px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.wa{background:#1F8F55;border-color:#1F8F55;color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.big{padding:14px 18px;font-size:15.5px;width:100%;border-radius:10px}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.s-libre{background:var(--sunken);color:var(--muted)}
.s-cocina{background:var(--info-bg);color:var(--info)}
.s-listo{background:var(--ok-bg);color:var(--ok)}
.s-comiendo{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.s-cuenta,.s-camino{background:var(--warn-bg);color:var(--warn)}
.s-llama,.s-cancelado{background:var(--crit-bg);color:var(--crit)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;font-weight:500}
.empty{color:var(--muted);text-align:center;padding:30px 14px;font-size:13.5px}
.empty svg.i{width:26px;height:26px;display:block;margin:0 auto 8px;opacity:.6}
input[type=text],input[type=number],input[type=url],input[type=search],input[type=tel],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fgrid .full{grid-column:1/-1}
@media (max-width:480px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;flex:none;background:var(--surface)}
.qty button{width:32px;height:32px;border:0;background:transparent;font-size:17px;line-height:1;display:grid;place-items:center}
.qty b{min-width:22px;text-align:center;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.kpi .d{font-size:12.5px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:9px 14px;border-bottom:1px solid var(--line);font-weight:700;background:var(--surface-2);white-space:nowrap}
table.t td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t input[type=number]{padding:6px 8px;width:96px}
table.t select{width:auto;padding:6px 8px}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
.switch{position:relative;width:38px;height:22px;flex:none;display:inline-block}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:11px;background:var(--line-2);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + span{background:var(--ok)}
.switch input:checked + span::after{transform:translateX(16px)}
.switch input:focus-visible + span{outline:2px solid var(--amarillo);outline-offset:2px}

/* ---------- Salón ---------- */
.legend{display:flex;gap:6px;flex-wrap:wrap}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tbl{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:118px;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.tbl::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--line)}
.tbl.st-cocina::before{background:var(--info)} .tbl.st-listo::before{background:var(--ok)} .tbl.st-cuenta::before{background:var(--warn)} .tbl.st-comiendo::before{background:var(--ink-2)}
.tbl:hover{box-shadow:var(--shadow)}
.tbl[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tbl .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.tbl .n{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.02em}
.tbl .n small{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.tbl .foot{margin-top:auto;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.tbl .foot b{color:var(--ink)}
.bell{width:26px;height:26px;border-radius:50%;background:var(--crit-bg);color:var(--crit);display:grid;place-items:center;flex:none}
.bell svg.i{width:14px;height:14px}
.qi{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.qi:last-child{border-bottom:0}
.qi .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.qi .tx{flex:1;min-width:150px}
.qi .tx b{display:block;font-size:14px}
.qi .tx span{font-size:13px;color:var(--muted)}
.ic.ready{background:var(--ok-bg);color:var(--ok)} .ic.call{background:var(--crit-bg);color:var(--crit)} .ic.bill{background:var(--warn-bg);color:var(--warn)}
.olist .o{padding:10px 0;border-bottom:1px dashed var(--line)}
.olist .o:last-child{border-bottom:0}
.picker-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.picker-tabs button{border:1px solid var(--line-2);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.picker-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}
.picker button{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;display:flex;flex-direction:column;gap:2px;min-height:60px}
.picker button:hover{border-color:var(--accent)}
.picker button span{color:var(--muted);font-size:12.5px;font-weight:500}
.picker button:disabled{opacity:.4}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.ln input{font-size:13px;padding:6px 9px}
.totline{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;font-weight:600}
.totline.g{padding-top:12px;font-weight:700}
.totline.g .v{font-size:20px;font-weight:800}

.demobar{background:#F2B13F;color:#2B1A10;font-size:13px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));text-align:center}
.demobar b{background:#2B1A10;color:#F2B13F;border-radius:5px;padding:1px 7px;margin-right:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}

/* ---------- Hoy (resumen y cierre) ---------- */
.now{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.now button{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.now button:hover{border-color:var(--muted)}
.now .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--sunken);color:var(--ink-2)}
.now .ic.hot{background:var(--warn-bg);color:var(--warn)}
.now b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.now span.l{font-size:12.5px;color:var(--muted)}
.hero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:900px){.hero{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hero .kpi .v{font-size:28px}
.g2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start;margin-bottom:20px}
@media (max-width:1000px){.g2{grid-template-columns:minmax(0,1fr)}}
.vchart{display:flex;align-items:stretch;gap:2px;height:150px;padding-top:18px}
.vchart .cw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;position:relative;cursor:default}
.vchart .b{background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.vchart .cw.z .b{background:var(--line);height:2px!important;border-radius:1px}
.vchart .cw.peak .b{background:var(--cafe)}
.vchart .val{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.vchart .cw:hover .b{filter:brightness(1.15)}
.vchart .cw .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:7px;white-space:nowrap;z-index:3;pointer-events:none}
.vchart .cw:hover .tip,.vchart .cw:focus .tip{display:block}
.vlbl{display:flex;gap:2px;margin-top:6px;font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
.vlbl span{flex:1;text-align:center}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(90px,1.1fr) minmax(0,2fr) auto;gap:10px;align-items:center;font-size:13.5px}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:10px;background:var(--sunken);border-radius:5px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.hb .v{font-weight:700;min-width:64px;text-align:right}
.split2{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.split2 i{display:block;height:100%}
.close-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:800px){.close-grid{grid-template-columns:minmax(0,1fr)}}
.cl{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.cl:last-child{border-bottom:0}
.cl.t{font-weight:800;font-size:16px;border-bottom:0;border-top:1px solid var(--line-2);margin-top:4px;padding-top:10px}
.diff{display:flex;justify-content:space-between;align-items:center;border-radius:10px;padding:12px 14px;font-weight:700}
.diff.ok{background:var(--ok-bg);color:var(--ok)} .diff.bad{background:var(--crit-bg);color:var(--crit)} .diff.warn{background:var(--warn-bg);color:var(--warn)}
.diff .v{font-family:var(--f-mono);font-size:20px}
.closed{display:flex;gap:10px;align-items:center;background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 14px;font-weight:600}

/* ---------- Panel por periodo (semana, mes, fechas) ---------- */
:root{--c1:#A0522D;--c2:#3B7DBA;--m0:#5B2A14;--m1:#8A4F2C;--m2:#B98563;--m3:#E3CDB8;--peak:#5B2A14;--heat:#5B2A14}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#C8743E;--c2:#4A8ED0;--m0:#F0C4A0;--m1:#C88B62;--m2:#93603F;--m3:#5E3D29;--peak:#F6D2B4;--heat:#F0B184}}
:root[data-theme="dark"]{--c1:#C8743E;--c2:#4A8ED0;--m0:#F0C4A0;--m1:#C88B62;--m2:#93603F;--m3:#5E3D29;--peak:#F6D2B4;--heat:#F0B184}
.vchart .cw.peak .b{background:var(--peak)}
.c1{background:var(--c1)} .c2{background:var(--c2)} .m0{background:var(--m0)} .m1{background:var(--m1)} .m2{background:var(--m2)} .m3{background:var(--m3)}
.kpi .dl{font-weight:700;color:var(--ink-2)} .kpi .dl.up{color:var(--ok)} .kpi .dl.dn{color:var(--crit)}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)} .lgd span{display:inline-flex;align-items:center;gap:6px} .lgd b{color:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.dchart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;height:240px}
.dchart .yax{display:flex;flex-direction:column;justify-content:space-between;font-size:10.5px;color:var(--muted);font-family:var(--f-mono);text-align:right;padding-bottom:22px;margin-top:-6px}
.dchart .plot{position:relative;display:flex;flex-direction:column;min-width:0}
.dchart .grid{position:absolute;inset:0 0 22px 0;display:flex;flex-direction:column-reverse;justify-content:space-between;pointer-events:none}
.dchart .grid i{display:block;border-top:1px solid var(--line)} .dchart .grid i:first-child{border-top-color:var(--line-2)}
.dchart .dbars{position:relative;flex:1;display:flex;align-items:flex-end;gap:2px}
.dchart.wide .dbars{gap:12px}
.dchart .dcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative;min-width:0;outline:none}
.dchart .stk{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:2px;min-height:0}
.dchart .stk i{display:block;min-height:0;flex-basis:0} .dchart .stk i:first-child{border-radius:4px 4px 0 0}
.dchart .dcol.fut .stk{display:none}
.dchart .dcol.fut::after{content:"";position:absolute;bottom:0;left:15%;right:15%;border-bottom:2px dotted var(--line-2)}
.dchart .dcol:hover .stk,.dchart .dcol:focus .stk{filter:brightness(1.15)}
.dchart .val{position:absolute;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:700;white-space:nowrap}
.dchart .xax{display:flex;gap:2px;height:22px;align-items:flex-end;font-size:10.5px;color:var(--muted);font-family:var(--f-mono)} .dchart.wide .xax{gap:12px}
.dchart .xax span{flex:1;text-align:center;white-space:nowrap;min-width:0;overflow:visible}
.ptip{display:none;position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;line-height:1.45;padding:7px 10px;border-radius:7px;white-space:nowrap;z-index:5;pointer-events:none;font-weight:500;text-align:left}
.dchart .dcol:first-child .ptip,.dchart .dcol:nth-child(2) .ptip{left:0;transform:none}
.dchart .dcol:last-child .ptip,.dchart .dcol:nth-last-child(2) .ptip{left:auto;right:0;transform:none}
.dcol:hover .ptip,.dcol:focus .ptip,.heat i:hover .ptip,.heat i:focus .ptip{display:block}
.heat i .ptip{top:auto;bottom:calc(100% + 6px)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-top:1px solid var(--line)}
.facts>div{padding:12px 16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)} .facts>div:last-child{border-right:0}
.facts b{font-size:17px;font-weight:800} .facts b.cap{text-transform:capitalize} .facts .muted{font-size:12.5px}
.heat{display:grid;grid-template-columns:30px repeat(15,minmax(13px,1fr));gap:3px;min-width:300px}
.heat .hx{font-size:10.5px;color:var(--muted);font-family:var(--f-mono);text-align:center}
.heat .hy{font-size:12px;color:var(--muted);font-weight:600;align-self:center}
.heat i,.heatkey i{display:block;aspect-ratio:1;border-radius:4px;background:color-mix(in srgb,var(--heat) var(--k),var(--sunken));position:relative;outline:none}
.heat i.na{background:var(--sunken);opacity:.5}
.heat i:hover,.heat i:focus{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--ink)}
.heatkey{display:flex;align-items:center;gap:4px;margin-top:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.heatkey i{width:14px;height:14px;aspect-ratio:auto}
.sbar{display:flex;gap:2px;height:14px;border-radius:5px;overflow:hidden}
.sbar i{display:block;min-width:0}
.slist{display:flex;flex-direction:column;gap:6px}
.slist>div{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:13.5px}
.slist>div span{color:var(--muted);min-width:44px;text-align:right} .slist>div b{min-width:84px;text-align:right}
.hb.rk{grid-template-columns:minmax(150px,1.3fr) minmax(0,1.5fr) auto} .hb.rk .nm{display:flex;gap:8px;align-items:center} .hb.rk .nm em{font-style:normal;font-size:11px;color:var(--muted);min-width:14px;font-weight:700}
.hb .v small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.drange{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.drange input[type=date]{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:6px 8px;font-size:13px;width:auto;min-width:0}
.quick{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:600px){.dchart{height:200px} .dchart.wide .dbars,.dchart.wide .xax{gap:5px} .dchart.wide .xax span{font-size:9.5px} .facts>div{border-right:0;border-bottom:1px solid var(--line)}}

/* ---------- Login (servidor propio) ---------- */
.login{min-height:100vh;min-height:100svh;box-sizing:border-box;display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.login-brand{background:var(--cafe-deep);color:#F6E9DA;padding:24px;line-height:1}
.login-brand b{display:block;font-family:var(--f-brand);font-weight:400;font-size:22px}
.login-brand b span{display:block;font-size:32px}
.login-brand small{display:block;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;opacity:.7;margin-top:8px}
.login a{color:var(--accent);font-weight:600}
input[type=password]{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 11px;width:100%;min-width:0}

/* ---------- Clientes y campañas ---------- */
.known{display:flex;flex-direction:column;gap:6px;background:var(--ok-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);border-radius:10px;padding:10px 12px;font-size:13px}
.known>.row b{color:var(--ok);display:inline-flex;gap:6px;align-items:center} .known svg.i{width:15px;height:15px}
table.t tr.selrow td{background:var(--surface-2);box-shadow:inset 0 0 0 0 transparent}
table.t tr.selrow td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.hrow:last-child{border-bottom:0} .hrow>span:nth-child(2){flex:1;min-width:0} .hrow>span:first-child{min-width:54px}
.hrow>span:first-child:has(b){flex:1;min-width:0}
.campi{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;width:100%}
.campi:hover{border-color:var(--muted)} .campi.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)} .campi .muted{font-size:12.5px}
.campi .obar,.card-b .obar{display:flex;gap:2px;border-radius:5px;overflow:hidden} .obar i{display:block;min-width:0}
.aud{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.aud button{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:9px 10px;font-weight:600;font-size:13px;text-align:left}
.aud button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.audn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px}
.audn b{font-size:18px}
.wabubble{background:#DCF8C6;color:#111B21;border-radius:10px 10px 10px 2px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;max-width:420px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.promo{display:flex;gap:12px;align-items:center;margin-top:16px;padding:14px;border-radius:12px;background:var(--cafe);color:#FFF6EC;position:relative;overflow:hidden}
.promo::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:linear-gradient(90deg,#F2B13F 0 50%,#124982 50% 75%,#C8102E 75%)}
.promo .tx{flex:1;min-width:0} .promo small{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;font-weight:800}
.promo b{display:block;font-size:17px;margin-top:2px} .promo .pr{font-size:15px;font-weight:800;margin-top:4px} .promo s{opacity:.7;font-weight:500;margin-left:6px;font-size:13px}
.promo .addb{border-color:#FFF6EC;color:#FFF6EC}
@media (max-width:480px){.aud{grid-template-columns:minmax(0,1fr)}}

/* ---------- Rutas de domicilio ---------- */

.zsel{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 10px 4px 8px;font-size:13.5px}

/* ---------- Domicilios ---------- */
.dcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}

.dl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.dl .hd{display:flex;justify-content:space-between;gap:8px;padding:12px 14px 8px;align-items:flex-start}

.dl .addr svg.i{width:15px;height:15px;margin-top:2px;color:var(--accent)}
.dl .items{padding:8px 14px;font-size:13px;color:var(--ink-2)}
.dl .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}

.chan{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--sunken);color:var(--ink-2)}

.timeline{list-style:none;margin:0;padding:6px 0 4px 0}
.timeline li{display:flex;gap:10px;font-size:13px;padding:3px 0;align-items:baseline}

.howto{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

.howto li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--sunken);font-weight:800;font-size:12px;display:grid;place-items:center}
.msgbox{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;word-break:break-word}

/* ---------- Cocina (pantalla oscura fija) ---------- */
.kitchen{--k-bg:#0F0A07;--k-card:#1B1410;--k-line:#2F241D;--k-ink:#F6EEE6;--k-muted:#A69281;--k-ok:#58C98A;--k-warn:#F2B13F;--k-crit:#FF6B5E;

.tk{background:var(--k-card);border:1px solid var(--k-line);border-radius:10px;margin-bottom:12px;overflow:hidden}

.tk.lv-warn .age{color:var(--k-warn);background:rgba(242,177,63,.14)}

.tk ul{list-style:none;margin:0;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.tk li{font-size:17px;font-weight:600;line-height:1.3;display:flex;gap:10px}
.tk li .q{font-family:var(--f-mono);color:#F2B13F;min-width:28px}

.tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px}

.cash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:520px){.cash{grid-template-columns:minmax(0,1fr)}}
.display{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px}
.display .v{font-family:var(--f-mono);font-size:22px;font-weight:600}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.change{display:flex;justify-content:space-between;align-items:baseline;border-radius:10px;padding:10px 12px;font-weight:700}

.bars{display:flex;align-items:flex-end;gap:4px;height:90px;padding-top:6px}

.qrcard{background:#fff;color:#5F010F;border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}

/* ---------- Cliente (mesa = vino cafetería · domicilio = crema antojos) ---------- */

.ghero{background:var(--vino);color:#fff;padding:22px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}

.ghero .top{display:flex;align-items:center;gap:12px}

};
const ic = (n,cls) => `<svg class="i${cls?" "+cls:""}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- Estado ---------- */
const S = {
  theme:(()=>{ try{ return localStorage.getItem("hmp-theme")||"system"; }catch(e){ return "system"; } })(),
  view:"hoy", dTab:"pedidos", menuTab:"dom", customers:[], campaigns:[], custSel:null, custQ:"", custEdit:null, campSel:null, campNew:false,
  cmp:{dishId:"",price:"",audience:"todos",days:"30",barrio:"",banner:true,valid:"3",msg:""},
  period:"hoy", pOff:0, rFrom:"", rTo:"", customer:false, delivery:false, table:1,
  todayOrders:[], closings:[], cf:{float:"",counted:"",notes:""}, confirmClose:false,
  db:null, dbState:"loading",
  orders:[], calls:[], payments:[], menuDb:{}, deliveries:[], doneDeliveries:[],
  config:{tables:10,link:"",waPhone:"34687703593",deliveryFee:3},
  cart:[], cartOpen:false, sent:null, q:"",
  staffCart:[], selTable:null, codeIn:"", pickCat:null,
  station:"todo", sound:false,
  cajaSel:null, tip:false, method:"Efectivo", received:"", split:1, confirmPay:false,
  confirmDemo:false, newIds:new Set(), toast:"",
  dCart:[], dForm:{name:"",phone:"",address:"",barrio:"",notes:"",channel:"WhatsApp",when:"entrega",pay:"Efectivo",cashFor:""}, dPaste:"", dPick:null,
  drivers:{}, confirmDl:null, cancelDl:null, histOpen:null, previewMode:"mesa",
  gForm:{name:"",phone:"",address:"",barrio:"",notes:"",when:"entrega",pay:"Efectivo",cashFor:"",paidOk:false}
};
let firstOrders = true, pendingRender = false;
/* Apariencia: claro, oscuro o automático (según el dispositivo). Se recuerda en cada dispositivo. */
let themeSet=false; // en "Auto" no se toca lo que ya haya puesto el visor
function applyTheme(){ const r=document.documentElement; if(S.theme==="light"||S.theme==="dark"){ r.setAttribute("data-theme",S.theme); themeSet=true; } else if(themeSet){ r.removeAttribute("data-theme"); themeSet=false; } }
function setTheme(v){ S.theme=v; try{ localStorage.setItem("hmp-theme",v); }catch(e){} applyTheme(); }
const THEMES=[["light","Claro","sun"],["system","Auto","auto"],["dark","Oscuro","moon"]];
const themeSw = () => `<div class="themesw" role="group" aria-label="Apariencia">${THEMES.map(([v,l,i])=>`<button data-act="theme" data-v="${v}" aria-pressed="${S.theme===v}" title="${l}">${ic(i)}<span>${l}</span></button>`).join("")}</div>`;
applyTheme();
const $root = document.getElementById("root");
const r2 = n => Math.round((+n||0)*100)/100;
const money = n => r2(n).toLocaleString("es-ES",{style:"currency",currency:"EUR"});
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mins = ts => Math.max(0,Math.floor((Date.now()-ts)/60000));
const tname = t => +t===0 ? "Barra" : +t<0 ? "Domicilio" : "Mesa "+t;
const olabel = o => o.label || tname(o.table);
const slug = c => c.normalize("NFD").replace(/[^\w]+/g,"");
const hhmm = ts => { if(!ts) return "—"; const d=new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const digits = s => String(s||"").replace(/\D/g,"");
const parseEur = s => { const v=parseFloat(String(s||"").replace(/[^\d,.]/g,"").replace(",",".")); return isNaN(v)?0:v; };
const waTo = (phone,text) => { let n=digits(phone); if(n.length===9) n="34"+n; return "https://wa.me/"+n+(text?"?text="+encodeURIComponent(text):""); };
const baseLink = () => (S.config.link||"").split("#")[0];

function menu(){
  const out = [];
  BASE_MENU.forEach(b=>{const o=S.menuDb[b.id]; if(o&&o.deleted) return; out.push(Object.assign({available:true},b,o||{}));});
  Object.keys(S.menuDb).forEach(id=>{ if(!BASE_MENU.find(b=>b.id===id)){const o=S.menuDb[id]; if(o&&!o.deleted&&o.name) out.push(Object.assign({available:true,desc:"",station:"cocina",cat:"Otros"},o,{id}));}});
  return out;
}
const item = id => menu().find(m=>m.id===id);
/* Dos menús: el del local (igual para todas las mesas) y el de domicilios. ch = "local" | "dom" */
const inMenu = (m,ch) => ch==="dom" ? m.dom!==false : m.local!==false;
const chMenu = ch => ch ? menu().filter(m=>inMenu(m,ch)) : menu();
const cats = ch => [...new Set(chMenu(ch).map(m=>m.cat))];
function activePromo(){ const p=S.config.promo; if(!p||!p.dishId) return null; if(p.until && Date.now()>p.until) return null; return p; }
function priceFor(m,ch){
  if(ch==="dom"){ const p=activePromo(); if(p && p.dishId===m.id && +p.price>0) return +p.price; if(m.domPrice!=null && m.domPrice!=="" && +m.domPrice>0) return +m.domPrice; }
  return m.price;
}

/* ---------- Ruta ---------- */
function readHash(){
  const h = (location.hash||"").slice(1).toLowerCase();
  const m = h.match(/^mesa(\d{1,3})$/);
  if(m){ S.customer=true; S.delivery=false; S.view="cliente"; S.table=+m[1]; }
  else if(h==="domicilio"){ S.customer=true; S.delivery=true; S.view="cliente"; S.table=-1; }
  else if(["hoy","mesero","domicilios","cocina","caja","ajustes","cliente"].includes(h)){ S.customer=false; S.view=h; }
}
readHash();
window.addEventListener("hashchange",()=>{readHash();render();});
function go(v){ S.view=v; try{history.replaceState(null,"","#"+v);}catch(e){} render(); window.scrollTo(0,0); }

/* ---------- Base de datos ---------- */
let loadTimer = setTimeout(()=>{ if(S.dbState==="loading"){ S.dbState="slow"; render(); } },10000);
/* Tres formas de correr: en Claude (claude.use), en la demo (memoria) o en servidor propio (Firebase, ver hmp-host.js). */
const HOST = window.__HMP_HOST || null;
const canLive = () => !!S.db && S.dbState!=="off" && !S.publicOnly;
(async ()=>{
  if(HOST){
    if(S.customer){ connect(HOST.db,true); return; }
    HOST.onUser(u=>{ S.user=u||null; if(u){ if(!S.db) connect(HOST.db,false); } else { S.dbState="login"; clearTimeout(loadTimer); render(); } });
    return;
  }
  let db = null;
  try{ db = window.__DEMO_DB || (window.claude && await window.claude.use("db")); }catch(e){ db=null; }
  if(!db){ S.dbState="off"; clearTimeout(loadTimer); render(); return; }
  connect(db,false);
})();
function connect(db, publicOnly){
  S.db = db; S.publicOnly = !!publicOnly;
  const fail = e => { console.warn(e); if(S.dbState!=="ok"){ S.dbState = e&&e.code==="permission-denied" ? "denied" : "off"; clearTimeout(loadTimer); render(); } };
  const ok = () => { if(S.dbState!=="ok"){ S.dbState="ok"; clearTimeout(loadTimer);} };
  if(publicOnly){
    // Clientes en la web pública: solo leen el menú y los ajustes; los pedidos van por WhatsApp o código.
    db.collection("menu").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); S.menuDb=m; queueRender(); }, e=>console.warn(e));
    db.doc("config/main").onSnapshot(snap=>{ if(snap.exists) S.config = Object.assign({},S.config,snap.data()); clearTimeout(loadTimer); queueRender(); }, e=>console.warn(e));
    return;
  }
  const day = new Date(); day.setHours(0,0,0,0);
  db.collection("orders").where("paid","==",false).onSnapshot(snap=>{
    if(!snap.metadata.fromCache) ok();
    if(!firstOrders){ snap.docChanges().forEach(c=>{ if(c.type==="added" && c.doc.data().status==="nuevo"){ S.newIds.add(c.doc.id); beep(); } }); }
    firstOrders=false;
    S.orders = snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    queueRender();
  }, fail);
  db.collection("calls").where("done","==",false).onSnapshot(snap=>{ S.calls = snap.docs.map(d=>Object.assign({id:d.id},d.data())); queueRender(); }, fail);
  db.collection("payments").where("createdAt",">=",day.getTime()).onSnapshot(snap=>{ S.payments = snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>b.createdAt-a.createdAt); queueRender(); }, fail);
  db.collection("deliveries").where("paid","==",false).onSnapshot(snap=>{ S.deliveries = snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>a.createdAt-b.createdAt); queueRender(); }, fail);
  db.collection("deliveries").where("createdAt",">=",day.getTime()).onSnapshot(snap=>{ S.doneDeliveries = snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(d=>d.paid).sort((a,b)=>b.createdAt-a.createdAt); queueRender(); }, fail);
  db.collection("orders").where("createdAt",">=",day.getTime()).onSnapshot(snap=>{ S.todayOrders = snap.docs.map(d=>Object.assign({id:d.id},d.data())); queueRender(); }, fail);
  db.collection("closings").orderBy("date","desc").limit(400).onSnapshot(snap=>{ S.closings = snap.docs.map(d=>Object.assign({id:d.id},d.data())); queueRender(); }, fail);
  db.collection("menu").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); S.menuDb=m; queueRender(); }, fail);
  db.collection("customers").onSnapshot(snap=>{ S.customers = snap.docs.map(d=>Object.assign({id:d.id},d.data())); queueRender(); }, fail);
  db.collection("campaigns").onSnapshot(snap=>{ S.campaigns = snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>b.createdAt-a.createdAt); queueRender(); }, fail);
  db.doc("config/main").onSnapshot(snap=>{ if(snap.exists) S.config = Object.assign({},S.config,snap.data()); if(!snap.metadata.fromCache) ok(); queueRender(); }, fail);
}

function queueRender(){
  const a = document.activeElement;
  if(a && $root.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)){ pendingRender = true; return; }
  render();
}
$root.addEventListener("focusout",()=>setTimeout(()=>{ if(pendingRender){ pendingRender=false; queueRender(); } },0));

async function w(fn, okMsg){
  if(!S.db || S.publicOnly){ toast(HOST?"Inicia sesión para guardar cambios.":"Sin conexión a los datos. Inicia sesión en claude.ai con acceso a esta página."); return false; }
  try{ await fn(S.db); if(okMsg) toast(okMsg); return true; }
  catch(e){ console.warn(e); toast(e && e.code==="permission-denied" ? "Tu usuario no tiene permiso para guardar. Pide que te den de alta en el equipo." : e && e.code==="invalid_argument" ? "Tu usuario no tiene permiso para guardar. Pide acceso de Colaborador." : e && e.code==="quota_exceeded" ? "La base de datos está llena: borra pedidos viejos." : "No se pudo guardar. Intenta de nuevo."); return false; }

function tableInfo(t){
  const os = S.orders.filter(o=>+o.table===+t);
  const cs = S.calls.filter(c=>+c.table===+t);
  let state="libre", label="Libre";
  if(os.length){ state="comiendo"; label="Servida"; }
  if(os.some(o=>o.status==="nuevo"||o.status==="preparando")){ state="cocina"; label="En preparación"; }
  if(os.some(o=>o.status==="listo")){ state="listo"; label="Listo para llevar"; }
  if(cs.some(c=>c.type==="cuenta")){ state="cuenta"; label="Pide la cuenta"; }
  const total = r2(os.reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.price*i.qty,0),0));
  const first = os.length ? Math.min(...os.map(o=>o.createdAt)) : null;
  return {os, cs, state, label, total, first, llama: cs.some(c=>c.type==="mesero")};
}
const lineTotal = items => r2(items.reduce((a,i)=>a+i.price*i.qty,0));
function addTo(cart,id,ch){ const m=item(id); if(!m||m.available===false) return; const l=cart.find(l=>l.id===id&&!l.note); if(l) l.qty++; else cart.push({id,name:m.name,price:priceFor(m,ch||"local"),station:m.station,qty:1,note:""}); }
const codeBody = cart => cart.map(l=>l.id+(l.qty>1?"x"+l.qty:"")).join(".");
function parseCode(code){
  const m = String(code).trim().toUpperCase().replace(/\s+/g,"").match(/^(?:M(\d+)|D)-(.+)$/); if(!m) return null;
  const ch=m[1]!==undefined?"local":"dom";
  const cart=[]; for(const part of m[2].split(".")){ const p=part.match(/^([A-Z]+\d+)(?:X(\d+))?$/); if(!p) return null; if(!item(p[1])) return null; for(let i=0;i<(+p[2]||1);i++) addTo(cart,p[1],ch); }
  return {table:m[1]!==undefined?+m[1]:-1, cart};
}
async function sendOrder(t,cart,source){

  const now=Date.now();
  return w(async db=>{ for(const st of Object.keys(groups)){ await db.collection("orders").add({table:+t,station:st,items:groups[st],status:"nuevo",createdAt:now,paid:false,source}); } });
}

function parseWhatsApp(text){
  const get = k => { const r=new RegExp("^\\s*"+k+"\\s*:\\s*(.+)$","im").exec(text); return r?r[1].trim():""; };
  const code = get("C[oó]digo"), p = code ? parseCode(code) : null;
  const pay = get("Pago"), cash = /paga con\s*([\d.,]+)/i.exec(pay);
  return { cart: p ? p.cart : null, form: { name:get("Nombre"), phone:get("Tel[eé]fono"), address:get("Direcci[oó]n"), barrio:get("Barrio(?: o CP)?"), notes:get("Notas"),
    when: /ahora|adelantado|ya pag/i.test(pay) ? "ahora" : "entrega", consent: /^\s*promociones\s*:\s*s[ií]/im.test(text),
    pay: ALLPAY.find(m=>pay.toLowerCase().includes(m.toLowerCase())) || "", cashFor: cash?cash[1]:"" } };
}

const custKey = phone => digits(phone).slice(-9);
const custOf = phone => { const k=custKey(phone); return k.length>=9 ? S.customers.find(c=>c.id===k) : null; };
function habitual(c){
  if(!c||!c.items) return [];
  const n=Math.max(1,c.orders||1);
  return Object.entries(c.items).filter(([,x])=>x.qty>0).sort((a,b)=>b[1].qty-a[1].qty).slice(0,3)
    .map(([id,x])=>({id,name:x.name,times:x.qty,qty:Math.max(1,Math.round(x.qty/n))}));
}
const daysAgo = ts => ts ? Math.floor((Date.now()-ts)/86400000) : null;
function agoTxt(ts){ const d=daysAgo(ts); return d==null?"—":d===0?"hoy":d===1?"ayer":`hace ${d} días`; }
async function upsertCustomer(db,f,items,total,deliveryId,now,sign){
  const k=custKey(f.phone); if(k.length<9) return;
  const c=Object.assign({},S.customers.find(x=>x.id===k)||{});
  const its=Object.assign({},c.items||{});
  items.forEach(i=>{ const x=Object.assign({name:i.name,qty:0},its[i.id]||{}); x.name=i.name; x.qty=Math.max(0,x.qty+sign*i.qty); its[i.id]=x; });
  let hist=(c.history||[]).slice();
  if(sign>0) hist=[{at:now,id:deliveryId,total,ids:items.map(i=>i.id),txt:itemsLine(items).replace(/&[^;]+;/g,"")}].concat(hist).slice(0,15);
  else hist=hist.filter(x=>x.id!==deliveryId);
  const doc={name:f.name||c.name||"",phone:f.phone||c.phone||"",address:f.address||c.address||"",barrio:f.barrio||c.barrio||"",notes:c.notes||"",
    consent: f.consent!=null ? (!!f.consent || !!c.consent) : !!c.consent, consentAt: f.consent&&!c.consent ? now : (c.consentAt||null),
    orders:Math.max(0,(c.orders||0)+sign), spent:r2(Math.max(0,(c.spent||0)+sign*total)), firstAt:c.firstAt||now, lastAt: sign>0?now:(hist[0]?hist[0].at:c.firstAt||null),
    items:its, history:hist, channel:f.channel||c.channel||""};
  await db.doc("customers/"+k).set(doc);
}
async function createDelivery(f,cart,source){
  const sub=lineTotal(cart), fee=feeOf(), now=Date.now(), first=(f.name||"Cliente").trim().split(" ")[0];
  const items=cart.map(l=>({id:l.id,name:l.name,price:l.price,qty:l.qty,note:l.note||"",station:l.station}));
  return w(async db=>{
    const ref=db.collection("deliveries").doc();
    await ref.set({name:f.name,phone:f.phone,address:f.address,barrio:f.barrio||"",notes:f.notes||"",channel:f.channel||"WhatsApp",pay:f.pay||"Efectivo",cashFor:f.when==="ahora"?0:parseEur(f.cashFor),
      prepaid:f.when==="ahora",payVerified:false,phoneKey:custKey(f.phone),
      items,subtotal:sub,fee,total:r2(sub+fee),status:"recibido",createdAt:now,paid:false,source,
      log:[{at:now,what:"Pedido recibido por "+(f.channel||"WhatsApp")+(f.when==="ahora"?" · pago por adelantado con "+f.pay:" · paga al recibir con "+f.pay)}]});
    const groups={}; items.forEach(i=>{ (groups[i.station]=groups[i.station]||[]).push({id:i.id,name:i.name,price:i.price,qty:i.qty,note:i.note}); });
    for(const st of Object.keys(groups)) await db.collection("orders").add({table:-1,label:"Domicilio · "+first,delivery:ref.id,station:st,items:groups[st],status:"nuevo",createdAt:now,paid:false,source:"domicilio"});
    await upsertCustomer(db,f,items,r2(sub+fee),ref.id,now,1);
  });
}

function payBlock(g,tot){
  const now=g.when==="ahora", opts=now?payNowOpts():DPAY;

  let how="";
  const bz=digits(S.config.bizum||S.config.waPhone||"").replace(/^34(?=\d{9}$)/,"").replace(/(\d{3})(?=\d)/g,"$1 ");
  if(now && g.pay==="Bizum") how=`<div class="msgbox" style="white-space:normal">Envía <b>${money(tot)}</b> por Bizum al <b class="mono">${esc(bz)}</b> con el concepto <b>«${esc(concept)}»</b>.</div>`;
  if(now && g.pay==="Tarjeta online") how=`<a class="btn big" href="${esc(S.config.payLink)}" target="_blank" rel="noopener">Pagar ${money(tot)} con tarjeta</a><p class="muted" style="margin:0;font-size:12.5px">Se abre la página de pago segura. Si te pide el importe, escribe ${money(tot)}.</p>`;
  if(now && g.pay==="Transferencia") how=`<div class="msgbox" style="white-space:normal">Transfiere <b>${money(tot)}</b> a la cuenta <b class="mono">${esc(S.config.iban)}</b> con el concepto <b>«${esc(concept)}»</b>.</div>`;
  return `<div class="stack" style="gap:10px;margin-bottom:14px">
    <span class="label">¿Cuándo pagas?</span>
    <div class="seg" role="group" aria-label="Cuándo pagas" style="display:flex"><button style="flex:1" data-act="gWhen" data-v="ahora" aria-pressed="${now}">Pagar ahora</button><button style="flex:1" data-act="gWhen" data-v="entrega" aria-pressed="${!now}">Al recibir</button></div>
    <div class="methods" style="grid-template-columns:repeat(${opts.length},minmax(0,1fr))">${opts.map(p=>`<button data-act="gPay" data-v="${esc(p)}" aria-pressed="${g.pay===p}">${esc(p.replace(" (datáfono)","").replace(" al repartidor",""))}</button>`).join("")}</div>
    ${now?`${how}<label class="row" style="gap:10px;font-size:14px;font-weight:600"><span class="switch"><input type="checkbox" id="gPaid" data-act="gPaid" ${g.paidOk?"checked":""}><span></span></span>Ya hice el pago</label>`
      : g.pay==="Efectivo" ? `<label class="f">¿Con cuánto pagas? Así el repartidor lleva cambio<input type="text" inputmode="decimal" id="gCash" data-gform="cashFor" value="${esc(g.cashFor)}" placeholder="Ej: 20"></label>`
      : `<p class="muted" style="margin:0;font-size:13px">${g.pay.startsWith("Tarjeta")?"El repartidor lleva datáfono.":"Pagas por Bizum al repartidor cuando llegue."}</p>`}
  </div>`;
}

const payGroup = m => /tarjeta/i.test(m) ? "Tarjeta" : /bizum/i.test(m) ? "Bizum" : /transfer/i.test(m) ? "Transferencia" : "Efectivo";
const dayKey = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function daySummary(){
  const pays=S.payments, sales=r2(pays.reduce((a,p)=>a+p.total,0)), tips=r2(pays.reduce((a,p)=>a+(p.tip||0),0));
  const salaPays=pays.filter(p=>p.kind!=="domicilio"), domPays=pays.filter(p=>p.kind==="domicilio");
  const live=S.todayOrders.filter(o=>o.status!=="cancelado");
  const salaTickets=new Set(live.filter(o=>+o.table>=0).map(o=>o.table+"|"+o.createdAt)).size;
  const allDl=S.deliveries.concat(S.doneDeliveries).filter((d,i,a)=>a.findIndex(x=>x.id===d.id)===i);
  const domOrders=allDl.filter(d=>d.status!=="cancelado").length, cancelled=allDl.filter(d=>d.status==="cancelado").length;
  const byMethod={Efectivo:0,Tarjeta:0,Bizum:0,Transferencia:0}; pays.forEach(p=>{ const g=payGroup(p.method); byMethod[g]=r2(byMethod[g]+p.total); });
  const prod={}; live.forEach(o=>o.items.forEach(i=>{ prod[i.name]=(prod[i.name]||0)+i.qty; }));
  const topAll=Object.entries(prod).sort((a,b)=>b[1]-a[1]), top=topAll.slice(0,6);
  const hours=[]; for(let h=8;h<=22;h++) hours.push(h);
  const tickets={}; live.forEach(o=>{ const k=(o.delivery||o.table+"|"+o.createdAt); if(!tickets[k]) tickets[k]=o.createdAt; });
  const perH=hours.map(h=>Object.values(tickets).filter(ts=>new Date(ts).getHours()===h).length);
  const kt=live.filter(o=>o.listoAt).map(o=>(o.listoAt-o.createdAt)/60000), kitchenAvg=kt.length?Math.round(kt.reduce((a,b)=>a+b,0)/kt.length):null;
  const dt=S.doneDeliveries.filter(d=>d.deliveredAt).map(d=>(d.deliveredAt-d.createdAt)/60000), delivAvg=dt.length?Math.round(dt.reduce((a,b)=>a+b,0)/dt.length):null;
  const N=+S.config.tables||10;
  const openTables=[0,...Array.from({length:N},(_,i)=>i+1)].map(t=>tableInfo(t)).filter(x=>x.os.length);
  const pending=r2(openTables.reduce((a,x)=>a+x.total,0)+S.deliveries.filter(d=>d.status!=="cancelado"&&!d.prepaid).reduce((a,d)=>a+d.total,0));
  return {sales,tips,salaSales:r2(salaPays.reduce((a,p)=>a+p.total,0)),domSales:r2(domPays.reduce((a,p)=>a+p.total,0)),payCount:pays.length,
    orders:salaTickets+domOrders,salaTickets,domOrders,cancelled,byMethod,top,topAll,hours,perH,kitchenAvg,delivAvg,openTables,pending};
}

/* Ruta: agrupa por barrio los domicilios que aún no salen */
const zoneOf = d => { const b=(d.barrio||"").trim(); return b ? b.charAt(0).toUpperCase()+b.slice(1) : "Sin barrio"; };
const stopOf = d => [d.address, d.barrio, S.config.city||"Barcelona"].filter(Boolean).join(", ");
function mapsUrl(list){
  if(!list.length) return "";
  const stops=list.slice(0,10).map(stopOf), dest=stops[stops.length-1], way=stops.slice(0,-1);
  let u="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+encodeURIComponent(dest);
  if(S.config.address) u+="&origin="+encodeURIComponent(S.config.address);
  if(way.length) u+="&waypoints="+encodeURIComponent(way.join("|"));
  return u;
}
function routeCard(by){
  const pend=by.cocina.concat(by.listo).sort((a,b)=>zoneOf(a).localeCompare(zoneOf(b))||a.createdAt-b.createdAt);
  const zones={}; pend.forEach(d=>{ (zones[zoneOf(d)]=zones[zoneOf(d)]||[]).push(d); });
  S.routeSel = (S.routeSel||[]).filter(id=>pend.some(d=>d.id===id));
  const sel=pend.filter(d=>S.routeSel.includes(d.id)), selReady=sel.filter(d=>dInfo(d).stage==="listo");
  const url=mapsUrl(sel);
  return `<div class="card"><div class="card-h"><h3>Organizar ruta</h3><span class="muted" style="font-size:13px">${pend.length} domicilio${pend.length===1?"":"s"} por salir en ${Object.keys(zones).length} zona${Object.keys(zones).length===1?"":"s"}</span></div>
    ${pend.length?`<div class="zones">${Object.entries(zones).map(([z,list])=>{ const ready=list.filter(d=>dInfo(d).stage==="listo").length, allSel=list.every(d=>S.routeSel.includes(d.id));
      return `<div class="zone"><div class="zh"><button class="zsel" data-act="routeZone" data-z="${esc(z)}" aria-pressed="${allSel}">${ic("pin")}<b>${esc(z)}</b><span class="num">${list.length}</span></button><span class="muted" style="font-size:12.5px">${ready} de ${list.length} listo${list.length===1?"":"s"}</span></div>

      ${sel.length?`<div class="row" style="justify-content:space-between"><span><b class="num">${sel.length}</b> parada${sel.length===1?"":"s"} en este viaje${sel.length>10?" (Google Maps admite 10: se usan las primeras)":""}</span>${sel.length-selReady.length?`<span class="pill s-cocina">${sel.length-selReady.length} aún en cocina</span>`:""}</div>

  </div>`;

function audienceOf(cm){
  const base=S.customers.filter(c=>c.consent && custKey(c.phone).length>=9);
  if(cm.audience==="plato") return base.filter(c=>c.items&&c.items[cm.dishId]&&c.items[cm.dishId].qty>0);
  if(cm.audience==="inactivos") return base.filter(c=>daysAgo(c.lastAt)>=(+cm.days||30));
  if(cm.audience==="barrio") return base.filter(c=>zoneOf(c).toLowerCase()===String(cm.barrio||"").trim().toLowerCase());
  return base;
}
const AUD = {todos:"Todos los que aceptan promociones",plato:"Quienes ya pidieron este plato",inactivos:"Quienes no piden hace tiempo",barrio:"Un barrio"};
const CAMP_TPL = "Hola {nombre} 👋 Hoy en Hecho en mi Pueblo tenemos {plato}{precio}. Pídelo aquí 👉 {link}";
function campText(tpl,cm,c){
  const m=item(cm.dishId)||{name:cm.dishName||"",price:cm.normalPrice||0}, normal=cm.normalPrice!=null?cm.normalPrice:priceFor(Object.assign({},m),"local");
  const precio = cm.price ? ` a solo ${money(cm.price)} (antes ${money(normal)})` : (normal?` a ${money(normal)}`:"");
  return String(tpl||CAMP_TPL).replace(/\{nombre\}/g,((c&&c.name)||"").trim().split(" ")[0]||"").replace(/\{plato\}/g,m.name||cm.dishName||"").replace(/\{precio\}/g,precio).replace(/\{link\}/g,domLink());
}
function campResults(cm){

  return {n,eur:r2(eur)};
}

async function createCampaign(){
  const cm=S.cmp, m=item(cm.dishId); if(!m) return;
  const domNormal=m.domPrice?+m.domPrice:m.price, price=+String(cm.price).replace(",",".")||0;
  if(price && price>=domNormal){ toast("El precio de promoción debe ser menor que el normal."); return; }
  const draft={dishId:m.id,dishName:m.name,price:price||null,normalPrice:domNormal,audience:cm.audience,days:+cm.days||30,barrio:cm.barrio||""};
  const rec=audienceOf(draft).map(c=>c.id); if(!rec.length){ toast("No hay clientes en ese público."); return; }
  const now=Date.now(), days=cm.banner?(+cm.valid||3):3, until=now+days*86400000;
  const title=`${m.name}${price?" a "+money(price):""}`;
  const doc=Object.assign({},draft,{title,msg:cm.msg||CAMP_TPL,createdAt:now,until,banner:!!cm.banner,recipients:rec,sent:{}});
  let newId=null;
  const ok=await w(async db=>{
    const ref=db.collection("campaigns").doc(); newId=ref.id; await ref.set(doc);
    if(cm.banner) await db.doc("config/main").set(Object.assign({},S.config,{promo:{campaignId:ref.id,dishId:m.id,title,price:price||null,until}}));
  },"Campaña creada");
  if(ok){ S.campSel=newId; S.campNew=false; S.cmp={dishId:"",price:"",audience:"todos",days:"30",barrio:"",banner:true,valid:"3",msg:""}; render(); }
}

/* ----- Cocina ----- */
function vCocina(){
  const f=o=>S.station==="todo"||(S.station==="dom"?+o.table<0:o.station===S.station);
  const list=st=>S.orders.filter(o=>o.status===st&&f(o)).sort((a,b)=>a.createdAt-b.createdAt);
  const cols=[["nuevo","Por empezar","Empezar","preparando"],["preparando","En preparación","Marcar listo","listo"],["listo","Para servir / empacar","Servido","entregado"]];
  const lv=m=>m<8?"lv-ok":m<15?"lv-warn":"lv-crit";
  const active=S.orders.filter(o=>(o.status==="nuevo"||o.status==="preparando")&&f(o));
  const avg=active.length?Math.round(active.reduce((a,o)=>a+mins(o.createdAt),0)/active.length):0;
  let h = head("Cocina y barra",`${active.length} comanda${active.length===1?"":"s"} activa${active.length===1?"":"s"} · espera promedio ${avg} min`);

  <div class="kcols">${cols.map(([st,label,btn,next])=>{const L=list(st);return `<section class="kcol"><h3>${label}<b class="num">${L.length}</b></h3>
    ${L.length?L.map(o=>{const m=mins(o.createdAt), dom=+o.table<0;return `<article class="tk ${lv(m)} ${S.newIds.has(o.id)?"new":""}">
      <div class="hd"><div><div class="t">${esc(olabel(o))}</div><div class="meta"><span class="tag ${o.station}">${o.station==="barra"?"Barra":"Cocina"}</span>${dom?`<span class="tag dom">Para llevar</span>`:o.source==="mesa"?"<span>Pedido por QR</span>":"<span>Camarero</span>"}</div></div><span class="age num">${m}′</span></div>
      <ul>${o.items.map(i=>`<li><span class="q num">${i.qty}×</span><span>${esc(i.name)}${i.note?`<small>${esc(i.note)}</small>`:""}</span></li>`).join("")}</ul>
      <div class="ft">${st!=="nuevo"?`<button class="btn sm" data-act="status" data-id="${o.id}" data-st="${st==="preparando"?"nuevo":"preparando"}">Devolver</button>`:""}${st==="listo"&&dom?`<span style="flex:1;font-size:13px;color:var(--k-muted);align-self:center">Esperando repartidor</span>`:`<button class="btn pri" style="flex:1" data-act="status" data-id="${o.id}" data-st="${next}">${btn}</button>`}</div>
    </article>`;}).join(""):`<div class="empty">Sin comandas</div>`}</section>`;}).join("")}</div></div>`;
  return h;

        <div class="methods">${METHODS.map(m=>`<button data-act="method" data-m="${m}" aria-pressed="${S.method===m}">${m}</button>`).join("")}</div>

            <div class="row" style="gap:6px">${[tot,10,20,50].filter((v,i,a)=>a.indexOf(v)===i&&v>=tot).slice(0,4).map(v=>`<button class="btn sm num" style="flex:1" data-act="recvq" data-v="${v}">${v===tot?"Exacto":money(v)}</button>`).join("")}</div>

  }
  h += `</div></div>`;
  return h;
